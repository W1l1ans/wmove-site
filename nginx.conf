server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    error_page 404 /404.html;

    # Site institucional — aceita /sobre e /sobre.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache de arquivos estáticos do site
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Nunca listar a pasta de propostas
    location = /p/ { return 404; }
    location = /p   { return 404; }

    # Propostas: /p/<codigo>  ->  arquivo <codigo>.html
    # ^~ impede que a regra de cache acima capture arquivos daqui
    location ^~ /p/ {
        autoindex off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri.html =404;
    }
}
